<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Entrar em posição: tr (guia) + rm (deslocamento) = tm (manobrador)">
  <defs>
    <marker id="ap-d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="#D6A84F"/></marker>
    <marker id="ap-b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="#9db4d0"/></marker>
    <marker id="ap-w" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="#F7F3EA"/></marker>
  </defs>
  <rect width="420" height="280" rx="10" fill="#0B1220"/>
  <text x="16" y="28" font-family="Georgia, serif" font-size="16" fill="#CBD5E1">Entrar em posição</text>
  <!-- t origin -->
  <circle cx="95" cy="205" r="4" fill="#CBD5E1"/>
  <text x="77" y="222" font-family="Georgia, serif" font-size="16" fill="#CBD5E1">t</text>
  <!-- arco da velocidade de manobra (compasso) -->
  <path d="M 255 205 A 160 160 0 0 0 135 53" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="250" y="60" font-family="Inter" font-size="12" fill="#94a3b8">arco = veloc. de manobra</text>
  <!-- tr: guia -->
  <line x1="95" y1="205" x2="235" y2="150" stroke="#D6A84F" stroke-width="3" marker-end="url(#ap-d)"/>
  <circle cx="235" cy="150" r="4" fill="#D6A84F"/>
  <text x="241" y="148" font-family="Georgia, serif" font-size="16" fill="#D6A84F">r</text>
  <text x="120" y="190" font-family="Georgia, serif" font-size="15" fill="#D6A84F">tr (guia)</text>
  <!-- tm: manobrador (até o arco) -->
  <line x1="95" y1="205" x2="205" y2="78" stroke="#F7F3EA" stroke-width="3" marker-end="url(#ap-w)"/>
  <circle cx="205" cy="78" r="4" fill="#F7F3EA"/>
  <text x="211" y="76" font-family="Georgia, serif" font-size="16" fill="#F7F3EA">m</text>
  <text x="96" y="120" font-family="Georgia, serif" font-size="15" fill="#F7F3EA">tm (rumo)</text>
  <!-- rm: deslocamento r -> m (direção do novo posto) -->
  <line x1="235" y1="150" x2="205" y2="78" stroke="#9db4d0" stroke-width="3" marker-end="url(#ap-b)"/>
  <text x="232" y="112" font-family="Georgia, serif" font-size="15" fill="#9db4d0">rm</text>
  <text x="16" y="264" font-family="Inter, sans-serif" font-size="12.5" fill="#94a3b8">tr + rm = tm · |tm| = veloc. de manobra · tempo = distância ÷ VMR</text>
</svg>
