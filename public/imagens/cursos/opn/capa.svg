<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Operações Navais — OPN">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- ondas -->
  <g opacity="0.45" stroke="#D6A84F" stroke-width="1" fill="none">
    <path d="M0 350 Q200 320 400 350 T800 350"/>
    <path d="M0 380 Q200 350 400 380 T800 380"/>
    <path d="M0 410 Q200 380 400 410 T800 410"/>
  </g>
  <!-- Rosa de Manobras -->
  <g transform="translate(400 178)">
    <circle r="124" fill="none" stroke="#1E3A5F" stroke-width="2.5"/>
    <circle r="93" fill="none" stroke="#27405f" stroke-width="1.5"/>
    <circle r="62" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle r="31" fill="none" stroke="#334155" stroke-width="1.5"/>
    <!-- graduações a cada 30° -->
    <g stroke="#334155" stroke-width="1.5">
      <line x1="0" y1="-124" x2="0" y2="-112"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(30)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(60)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(90)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(120)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(150)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(180)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(210)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(240)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(270)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(300)"/>
      <line x1="0" y1="-124" x2="0" y2="-112" transform="rotate(330)"/>
    </g>
    <!-- triângulo de velocidades tr + rm = tm -->
    <path d="M0 0 L0 -86" stroke="#D6A84F" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M0 -86 L84 -46" stroke="#9db4d0" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M0 0 L84 -46" stroke="#F7F3EA" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M84 -46 l-13 -0.6 l5.6 11.6z" fill="#F7F3EA"/>
    <circle r="4.5" fill="#D6A84F"/>
    <text x="-12" y="6" font-family="Georgia, serif" font-size="16" fill="#9db4d0">t</text>
    <text x="-6" y="-92" font-family="Georgia, serif" font-size="16" fill="#D6A84F">r</text>
    <text x="90" y="-46" font-family="Georgia, serif" font-size="16" fill="#F7F3EA">m</text>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#F7F3EA">Operações Navais — OPN</text>
</svg>
