<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" role="img" aria-label="Retificador controlado: fonte CA V2, SCR com pulso de porta e carga RL">
  <rect x="0.75" y="0.75" width="438.5" height="278.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">SCR — retificador controlado</text>

  <!-- fonte CA V2 -->
  <circle cx="80" cy="150" r="28" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M64 150 q8 -12 16 0 q8 12 16 0" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="62" y="200" font-family="JetBrains Mono, monospace" font-size="12" fill="#CBD5E1">V2</text>

  <!-- malha superior até o anodo do SCR -->
  <line x1="80" y1="122" x2="80" y2="80" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="80" y1="80" x2="250" y2="80" stroke="#F7F3EA" stroke-width="2"/>
  <text x="232" y="74" font-family="JetBrains Mono, monospace" font-size="9" fill="#94A3B8">A</text>

  <!-- SCR -->
  <line x1="250" y1="80" x2="250" y2="98" stroke="#F7F3EA" stroke-width="2"/>
  <polygon points="235,98 265,98 250,120" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="235" y1="120" x2="265" y2="120" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="250" y1="120" x2="250" y2="150" stroke="#F7F3EA" stroke-width="2"/>
  <text x="268" y="108" font-family="Inter, sans-serif" font-size="11" fill="#F7F3EA">SCR</text>
  <text x="232" y="146" font-family="JetBrains Mono, monospace" font-size="9" fill="#94A3B8">K</text>
  <!-- porta -->
  <line x1="262" y1="120" x2="295" y2="134" stroke="#D6A84F" stroke-width="2"/>
  <text x="300" y="138" font-family="Inter, sans-serif" font-size="10" fill="#D6A84F">porta (pulso)</text>

  <!-- carga RL -->
  <line x1="250" y1="150" x2="250" y2="172" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M250 172 l-7 6 l14 6 l-14 6 l14 6 l-14 6 l7 6" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="262" y="198" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">RL</text>
  <line x1="250" y1="208" x2="250" y2="232" stroke="#F7F3EA" stroke-width="2"/>

  <!-- retorno -->
  <line x1="250" y1="232" x2="80" y2="232" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="80" y1="232" x2="80" y2="178" stroke="#F7F3EA" stroke-width="2"/>

  <text x="20" y="262" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">IL = (V2pico − queda)/RL ; queda de condução = 1,5 V</text>
</svg>
