<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360" role="img" aria-label="Base de tempo: fonte de corrente com transistor PNP carregando o capacitor, e UJT disparando em VP">
  <defs>
    <marker id="pnp" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F7F3EA"/>
    </marker>
    <marker id="emi2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F7F3EA"/>
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="538.5" height="358.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" fill="#CBD5E1">Base de tempo: fonte de corrente (PNP) + UJT</text>

  <!-- trilhos -->
  <line x1="70" y1="48" x2="470" y2="48" stroke="#F7F3EA" stroke-width="2"/>
  <text x="474" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">+12 V</text>
  <line x1="70" y1="330" x2="470" y2="330" stroke="#F7F3EA" stroke-width="2"/>
  <text x="474" y="334" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">GND</text>

  <!-- divisor de base 8,1k / 18k -->
  <line x1="100" y1="48" x2="100" y2="64" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M100 64 l-7 6 l14 6 l-14 6 l14 6 l-14 6 l7 6" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="40" y="90" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">8,1 kΩ</text>
  <line x1="100" y1="100" x2="100" y2="170" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="100" cy="170" r="3.5" fill="#D6A84F"/>
  <text x="40" y="167" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">Vb=8,3</text>
  <line x1="100" y1="170" x2="100" y2="200" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M100 200 l-7 6 l14 6 l-14 6 l14 6 l-14 6 l7 6" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="46" y="226" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">18 kΩ</text>
  <line x1="100" y1="236" x2="100" y2="330" stroke="#F7F3EA" stroke-width="2"/>

  <!-- transistor PNP (fonte de corrente) centro (210,170) -->
  <circle cx="205" cy="170" r="24" fill="none" stroke="#F7F3EA" stroke-width="1.5"/>
  <line x1="188" y1="154" x2="188" y2="186" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="100" y1="170" x2="188" y2="170" stroke="#F7F3EA" stroke-width="2"/>
  <!-- emissor (topo) com seta apontando p/ a base (PNP) -->
  <line x1="210" y1="148" x2="188" y2="162" stroke="#F7F3EA" stroke-width="2" marker-end="url(#pnp)"/>
  <line x1="210" y1="148" x2="210" y2="120" stroke="#F7F3EA" stroke-width="2"/>
  <!-- coletor (base) -->
  <line x1="188" y1="178" x2="210" y2="192" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="210" y1="192" x2="210" y2="250" stroke="#F7F3EA" stroke-width="2"/>
  <text x="228" y="150" font-family="Inter, sans-serif" font-size="11" fill="#F7F3EA">Q (PNP)</text>

  <!-- resistor de emissor 6k até +12 -->
  <line x1="210" y1="120" x2="210" y2="104" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M210 104 l-7 -6 l14 -6 l-14 -6 l14 -6 l-14 -6 l7 -6" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="220" y="80" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">6 kΩ</text>
  <line x1="210" y1="56" x2="210" y2="48" stroke="#F7F3EA" stroke-width="2"/>

  <!-- nó E (coletor) : capacitor + UJT -->
  <circle cx="210" cy="250" r="3.5" fill="#D6A84F"/>
  <text x="160" y="246" font-family="Inter, sans-serif" font-size="10" fill="#64748B">I = 0,5 mA</text>
  <!-- capacitor C ao terra -->
  <line x1="210" y1="250" x2="210" y2="272" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="194" y1="272" x2="226" y2="272" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="194" y1="280" x2="226" y2="280" stroke="#F7F3EA" stroke-width="2.5"/>
  <text x="230" y="280" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">C = ?</text>
  <line x1="210" y1="280" x2="210" y2="330" stroke="#F7F3EA" stroke-width="2"/>

  <!-- UJT centro (360,250) -->
  <line x1="210" y1="250" x2="334" y2="250" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="362" cy="250" r="28" fill="none" stroke="#F7F3EA" stroke-width="1.5"/>
  <line x1="364" y1="224" x2="364" y2="276" stroke="#F7F3EA" stroke-width="3"/>
  <line x1="334" y1="250" x2="362" y2="258" stroke="#F7F3EA" stroke-width="2" marker-end="url(#emi2)"/>
  <text x="300" y="244" font-family="Inter, sans-serif" font-size="9" fill="#64748B">emissor</text>
  <!-- B2 ao +12 -->
  <line x1="364" y1="224" x2="364" y2="48" stroke="#F7F3EA" stroke-width="2"/>
  <text x="370" y="232" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">B2</text>
  <!-- B1 ao GND + saída -->
  <line x1="364" y1="276" x2="364" y2="330" stroke="#F7F3EA" stroke-width="2"/>
  <text x="370" y="288" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">B1</text>
  <text x="398" y="250" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">η=0,8</text>
  <text x="398" y="266" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">VP=10,3 V</text>

  <text x="20" y="350" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">dV/dt = I/C ; achar C p/ f = 5 kHz → C = 10,5 nF   (SOPA PP1 2021)</text>
</svg>
