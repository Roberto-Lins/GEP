<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" role="img" aria-label="Formas de onda do 555 astável: a tensão no capacitor oscila entre um terço e dois terços de VCC, e a saída é uma onda retangular">
  <rect x="0.75" y="0.75" width="518.5" height="328.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" fill="#CBD5E1">555 astável: VC e Vo</text>

  <!-- plot superior: VC -->
  <text x="22" y="46" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">VC</text>
  <line x1="60" y1="70" x2="500" y2="70" stroke="#D6A84F" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="430" y="64" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">⅔ VCC</text>
  <line x1="60" y1="130" x2="500" y2="130" stroke="#D6A84F" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="430" y="148" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">⅓ VCC</text>

  <!-- VC: carrega (sobe) e descarrega (desce) entre os dois limiares -->
  <path d="M60 130 Q110 70 150 70 Q175 70 200 130 Q250 70 290 70 Q315 70 340 130 Q390 70 430 70 Q455 70 480 130"
        fill="none" stroke="#CBD5E1" stroke-width="2.5"/>

  <!-- plot inferior: Vo -->
  <text x="22" y="236" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Vo</text>
  <line x1="60" y1="280" x2="500" y2="280" stroke="#334155" stroke-width="1"/>
  <text x="34" y="226" font-family="Inter, sans-serif" font-size="11" fill="#64748B">alto</text>
  <text x="32" y="288" font-family="Inter, sans-serif" font-size="11" fill="#64748B">baixo</text>
  <!-- alto durante a carga, baixo durante a descarga -->
  <path d="M60 222 H150 V280 H200 V222 H290 V280 H340 V222 H430 V280 H480"
        fill="none" stroke="#D6A84F" stroke-width="3" stroke-linejoin="round"/>

  <!-- marcações -->
  <line x1="60" y1="298" x2="150" y2="298" stroke="#CBD5E1" stroke-width="1"/>
  <text x="86" y="312" font-family="JetBrains Mono, monospace" font-size="10" fill="#CBD5E1">T ALTO</text>
  <line x1="150" y1="298" x2="200" y2="298" stroke="#94A3B8" stroke-width="1"/>
  <text x="150" y="312" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">T BAIXO</text>
</svg>
