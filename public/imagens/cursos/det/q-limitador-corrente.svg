<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="470" height="300" role="img" aria-label="Regulador com limitador de corrente: transistor série Q1, resistor sensor RSC e transistor de proteção Q2">
  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F7F3EA"/>
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="468.5" height="298.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Limitador de corrente (Q1, RSC, Q2)</text>

  <!-- VI -->
  <circle cx="48" cy="55" r="4" fill="#D6A84F"/>
  <text x="22" y="48" font-family="JetBrains Mono, monospace" font-size="11" fill="#CBD5E1">VI</text>
  <line x1="48" y1="55" x2="190" y2="55" stroke="#F7F3EA" stroke-width="2"/>

  <!-- Q1 série (NPN) -->
  <circle cx="185" cy="90" r="20" fill="none" stroke="#F7F3EA" stroke-width="1.5"/>
  <line x1="171" y1="76" x2="171" y2="104" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="150" y1="90" x2="171" y2="90" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="171" y1="82" x2="190" y2="74" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="190" y1="74" x2="190" y2="55" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="171" y1="98" x2="190" y2="106" stroke="#F7F3EA" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="190" y1="106" x2="190" y2="135" stroke="#F7F3EA" stroke-width="2"/>
  <text x="198" y="74" font-family="Inter, sans-serif" font-size="11" fill="#F7F3EA">Q1</text>
  <circle cx="150" cy="90" r="3" fill="#D6A84F"/>

  <!-- P (emissor de Q1) -->
  <line x1="190" y1="135" x2="190" y2="155" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="190" cy="155" r="3.5" fill="#D6A84F"/>

  <!-- RSC -->
  <line x1="190" y1="155" x2="206" y2="155" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M206 155 l6 -7 l6 14 l6 -14 l6 14 l6 -14 l6 7" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="198" y="142" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">RSC = 0,28 Ω</text>
  <line x1="242" y1="155" x2="290" y2="155" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="290" cy="155" r="3.5" fill="#D6A84F"/>
  <text x="298" y="151" font-family="JetBrains Mono, monospace" font-size="11" fill="#CBD5E1">Vo</text>

  <!-- carga RL -->
  <line x1="290" y1="155" x2="360" y2="155" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="360" y1="155" x2="360" y2="172" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M360 172 l-7 6 l14 6 l-14 6 l14 6 l-14 6 l7 6" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="372" y="198" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">RL</text>
  <line x1="360" y1="208" x2="360" y2="252" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="348" y1="252" x2="372" y2="252" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="352" y1="257" x2="368" y2="257" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="356" y1="262" x2="364" y2="262" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Q2 de proteção (NPN, base à direita) -->
  <circle cx="150" cy="206" r="20" fill="none" stroke="#F7F3EA" stroke-width="1.5"/>
  <line x1="164" y1="192" x2="164" y2="220" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="164" y1="206" x2="182" y2="206" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="164" y1="200" x2="150" y2="192" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="150" y1="192" x2="150" y2="90" stroke="#D6A84F" stroke-width="2"/>
  <line x1="164" y1="212" x2="150" y2="220" stroke="#F7F3EA" stroke-width="2" marker-end="url(#e1)"/>
  <line x1="150" y1="220" x2="150" y2="248" stroke="#F7F3EA" stroke-width="2"/>
  <text x="108" y="200" font-family="Inter, sans-serif" font-size="11" fill="#F7F3EA">Q2</text>

  <!-- base de Q2 -> Vo (após RSC) -->
  <line x1="182" y1="206" x2="290" y2="206" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="290" y1="206" x2="290" y2="155" stroke="#F7F3EA" stroke-width="2"/>

  <!-- emissor de Q2 -> P (antes de RSC) ; cruza sem ponto -->
  <line x1="150" y1="248" x2="190" y2="248" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="190" y1="248" x2="190" y2="155" stroke="#F7F3EA" stroke-width="2"/>

  <text x="20" y="288" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">Q2 liga quando V(RSC) ≈ 0,7 V → I_curto ≈ 0,7/RSC</text>
</svg>
