<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="380" height="320" role="img" aria-label="Curva de histerese do Schmitt-trigger: saída em função da entrada">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D6A84F"/>
    </marker>
  </defs>
  <rect x="0.75" y="0.75" width="378.5" height="318.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" fill="#CBD5E1">Histerese (Vo × Vi)</text>

  <!-- eixos -->
  <line x1="40" y1="170" x2="350" y2="170" stroke="#334155" stroke-width="1.2"/>
  <line x1="190" y1="50" x2="190" y2="300" stroke="#334155" stroke-width="1.2"/>
  <text x="338" y="188" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Vi</text>
  <text x="198" y="58" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Vo</text>

  <!-- guias -->
  <line x1="130" y1="90" x2="130" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="250" y1="90" x2="250" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="130" y1="90" x2="250" y2="90" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="130" y1="250" x2="250" y2="250" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- laço de histerese (inversor) -->
  <path d="M70 90 H250" fill="none" stroke="#D6A84F" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M250 90 V250" fill="none" stroke="#D6A84F" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M310 250 H130" fill="none" stroke="#D6A84F" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M130 250 V90" fill="none" stroke="#D6A84F" stroke-width="3" marker-end="url(#ah)"/>

  <!-- rótulos -->
  <text x="92" y="280" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">LTP −8</text>
  <text x="226" y="280" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">UTP +8</text>
  <text x="198" y="86" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">+12</text>
  <text x="198" y="262" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">−12</text>
</svg>
