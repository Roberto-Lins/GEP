<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Formas de onda do Schmitt-trigger inversor: entrada triangular e saída quadrada">
  <rect x="0.75" y="0.75" width="558.5" height="378.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" fill="#CBD5E1">Entrada × saída (Schmitt inversor)</text>

  <!-- ===== Plot superior: entrada ===== -->
  <text x="22" y="48" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Vi</text>
  <line x1="60" y1="90" x2="520" y2="90" stroke="#334155" stroke-width="1"/>
  <text x="34" y="40" font-family="Inter, sans-serif" font-size="11" fill="#64748B">+12</text>
  <text x="36" y="150" font-family="Inter, sans-serif" font-size="11" fill="#64748B">−12</text>

  <!-- limiares -->
  <line x1="60" y1="54" x2="520" y2="54" stroke="#D6A84F" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="455" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">UTP +8 V</text>
  <line x1="60" y1="126" x2="520" y2="126" stroke="#D6A84F" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="455" y="138" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">LTP −8 V</text>

  <!-- onda triangular de entrada -->
  <path d="M60 144 L290 36 L520 144" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="252" cy="54" r="3.5" fill="#D6A84F"/>
  <circle cx="482" cy="126" r="3.5" fill="#D6A84F"/>

  <!-- guias verticais de comutação -->
  <line x1="252" y1="54" x2="252" y2="344" stroke="#D6A84F" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
  <line x1="482" y1="126" x2="482" y2="236" stroke="#D6A84F" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>

  <!-- ===== Plot inferior: saída ===== -->
  <text x="22" y="248" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Vo</text>
  <line x1="60" y1="290" x2="520" y2="290" stroke="#334155" stroke-width="1"/>
  <text x="34" y="240" font-family="Inter, sans-serif" font-size="11" fill="#64748B">+12</text>
  <text x="36" y="350" font-family="Inter, sans-serif" font-size="11" fill="#64748B">−12</text>

  <!-- onda quadrada de saída (inversora) -->
  <path d="M60 236 H252 V344 H482 V236 H520" fill="none" stroke="#D6A84F" stroke-width="3" stroke-linejoin="round"/>

  <text x="120" y="372" font-family="Inter, sans-serif" font-size="11" fill="#64748B">A saída só comuta nos limiares: cai em UTP (subindo) e sobe em LTP (descendo).</text>
</svg>
