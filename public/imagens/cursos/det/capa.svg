<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Detecção — capa">
  <defs>
    <linearGradient id="detBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#13243B"/>
      <stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
    <pattern id="detGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D6A84F" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="800" height="360" fill="url(#detBg)"/>
  <rect width="800" height="360" fill="url(#detGrid)"/>

  <!-- onda senoidal (sinal de entrada) -->
  <path d="M40 120 q30 -50 60 0 t60 0 t60 0 t60 0"
        fill="none" stroke="#CBD5E1" stroke-width="3" opacity="0.65" stroke-linecap="round"/>
  <!-- onda quadrada (saída saturada do comparador) -->
  <path d="M40 230 H100 V170 H160 V230 H220 V170 H280 V230"
        fill="none" stroke="#D6A84F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- rampa / dente-de-serra (base de tempo) -->
  <path d="M40 320 L120 250 L120 320 L200 250 L200 320 L280 250 L280 320"
        fill="none" stroke="#22C55E" stroke-width="3" opacity="0.8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- bloco de "circuito" estilizado à direita -->
  <g stroke="#D6A84F" stroke-width="3" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M560 90 H620"/>
    <rect x="620" y="78" width="56" height="24" rx="4" fill="#0B1220"/>
    <path d="M676 90 H740"/>
    <path d="M650 102 V150"/>
    <circle cx="650" cy="170" r="20" fill="#0B1220"/>
    <path d="M640 170 H660 M650 160 V180"/>
    <path d="M560 250 H600 M620 250 H740"/>
    <path d="M600 238 L620 250 L600 262 Z" fill="#D6A84F"/>
  </g>
  <circle cx="560" cy="90" r="4" fill="#D6A84F"/>
  <circle cx="740" cy="90" r="4" fill="#D6A84F"/>
  <circle cx="740" cy="250" r="4" fill="#D6A84F"/>
</svg>
