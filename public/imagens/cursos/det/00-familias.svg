<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="540" height="270" role="img" aria-label="As cinco famílias de circuito da PP1 de Detecção">
  <rect x="0.75" y="0.75" width="538.5" height="268.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" fill="#CBD5E1">As famílias de circuito da PP1</text>

  <!-- linha 1: 3 cartões -->
  <g font-family="Inter, sans-serif">
    <rect x="14" y="46" width="164" height="86" rx="10" fill="#13243B" stroke="#D6A84F" stroke-width="1.5"/>
    <text x="26" y="74" font-size="14" fill="#F7F3EA" font-weight="bold">Fontes reguladas</text>
    <text x="26" y="96" font-size="12" fill="#CBD5E1">Estabiliza a</text>
    <text x="26" y="113" font-size="12" fill="#CBD5E1">tensão CC</text>

    <rect x="188" y="46" width="164" height="86" rx="10" fill="#13243B" stroke="#D6A84F" stroke-width="1.5"/>
    <text x="200" y="74" font-size="14" fill="#F7F3EA" font-weight="bold">Limitadores e</text>
    <text x="200" y="92" font-size="14" fill="#F7F3EA" font-weight="bold">grampeadores</text>
    <text x="200" y="114" font-size="12" fill="#CBD5E1">Corta ou desloca a onda</text>

    <rect x="362" y="46" width="164" height="86" rx="10" fill="#13243B" stroke="#D6A84F" stroke-width="1.5"/>
    <text x="374" y="74" font-size="14" fill="#F7F3EA" font-weight="bold">Comparadores,</text>
    <text x="374" y="92" font-size="14" fill="#F7F3EA" font-weight="bold">555 e Schmitt</text>
    <text x="374" y="114" font-size="12" fill="#CBD5E1">Compara e temporiza</text>
  </g>

  <!-- linha 2: 2 cartões centralizados -->
  <g font-family="Inter, sans-serif">
    <rect x="101" y="146" width="164" height="86" rx="10" fill="#13243B" stroke="#D6A84F" stroke-width="1.5"/>
    <text x="113" y="174" font-size="14" fill="#F7F3EA" font-weight="bold">Tiristores e UJT</text>
    <text x="113" y="196" font-size="12" fill="#CBD5E1">Chaves que ligam</text>
    <text x="113" y="213" font-size="12" fill="#CBD5E1">por disparo</text>

    <rect x="275" y="146" width="164" height="86" rx="10" fill="#13243B" stroke="#D6A84F" stroke-width="1.5"/>
    <text x="287" y="174" font-size="14" fill="#F7F3EA" font-weight="bold">Base de tempo</text>
    <text x="287" y="196" font-size="12" fill="#CBD5E1">Gera uma rampa</text>
    <text x="287" y="213" font-size="12" fill="#CBD5E1">linear</text>
  </g>

  <text x="20" y="256" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Toda questão da prova cai em uma destas famílias. Classificar primeiro é meio caminho.</text>
</svg>
