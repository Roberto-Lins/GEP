<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250" role="img" aria-label="Schmitt-trigger com 555: entrada nos pinos 2 e 6, saída no pino 3, limiares em um terço e dois terços de VCC">
  <rect x="0.75" y="0.75" width="418.5" height="248.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Schmitt-trigger com 555</text>

  <!-- trilhos -->
  <line x1="60" y1="46" x2="340" y2="46" stroke="#F7F3EA" stroke-width="2"/>
  <text x="344" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">+VCC</text>
  <line x1="60" y1="206" x2="340" y2="206" stroke="#F7F3EA" stroke-width="2"/>
  <text x="344" y="210" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">GND</text>

  <!-- CI 555 -->
  <rect x="180" y="88" width="110" height="80" rx="6" fill="#13243B" stroke="#D6A84F" stroke-width="2"/>
  <text x="212" y="134" font-family="Inter, sans-serif" font-size="16" fill="#D6A84F" font-weight="bold">555</text>
  <text x="186" y="112" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">6</text>
  <text x="186" y="158" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">2</text>
  <text x="280" y="124" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">3</text>
  <text x="232" y="100" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">8/4</text>
  <text x="232" y="164" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">1</text>

  <!-- pinos 8/4 -> VCC, 1 -> GND -->
  <line x1="235" y1="88" x2="235" y2="46" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="235" y1="168" x2="235" y2="206" stroke="#F7F3EA" stroke-width="2"/>

  <!-- entrada nos pinos 2 e 6 (ligados) -->
  <line x1="180" y1="108" x2="150" y2="108" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="180" y1="150" x2="150" y2="150" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="150" y1="108" x2="150" y2="150" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="150" cy="129" r="3.5" fill="#D6A84F"/>
  <line x1="150" y1="129" x2="70" y2="129" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="70" cy="129" r="4" fill="#D6A84F"/>
  <text x="44" y="133" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Vi</text>

  <!-- saída pino 3 -->
  <line x1="290" y1="118" x2="360" y2="118" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="360" cy="118" r="4" fill="#D6A84F"/>
  <text x="368" y="122" font-family="JetBrains Mono, monospace" font-size="11" fill="#CBD5E1">Vo</text>

  <text x="20" y="236" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">UTP = ⅔VCC = 8 V ; LTP = ⅓VCC = 4 V  (VCC = 12 V)</text>
</svg>
