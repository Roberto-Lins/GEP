<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img" aria-label="Rampa linear da base de tempo: subida em linha reta (carga por corrente constante) e descida rápida">
  <rect x="0.75" y="0.75" width="518.5" height="248.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" fill="#CBD5E1">Base de tempo: rampa linear</text>

  <!-- nível final e base -->
  <line x1="60" y1="60" x2="470" y2="60" stroke="#D6A84F" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="476" y="64" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">V final</text>
  <line x1="60" y1="200" x2="470" y2="200" stroke="#334155" stroke-width="1"/>

  <!-- rampa LINEAR (linhas retas) + descida rápida -->
  <path d="M60 200 L180 60 L180 200 L300 60 L300 200 L420 60 L420 200 L470 142"
        fill="none" stroke="#D6A84F" stroke-width="3" stroke-linejoin="round"/>

  <text x="92" y="120" font-family="JetBrains Mono, monospace" font-size="11" fill="#CBD5E1">dV/dt = I/C</text>
  <text x="20" y="232" font-family="Inter, sans-serif" font-size="11" fill="#64748B">A subida é uma RETA (carga por corrente constante) — diferente da curva exponencial do UJT.</text>
</svg>
