<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-label="Fonte de corrente constante de 0,5 mA carregando um capacitor de 1 µF">
  <rect x="0.75" y="0.75" width="358.5" height="258.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Carga por fonte de corrente</text>

  <!-- fonte de corrente (círculo com seta) -->
  <line x1="140" y1="48" x2="140" y2="62" stroke="#F7F3EA" stroke-width="2"/>
  <text x="112" y="44" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">+V</text>
  <circle cx="140" cy="86" r="24" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="140" y1="98" x2="140" y2="74" stroke="#F7F3EA" stroke-width="2"/>
  <polygon points="135,80 145,80 140,72" fill="#F7F3EA"/>
  <text x="170" y="90" font-family="JetBrains Mono, monospace" font-size="12" fill="#D6A84F">I = 0,5 mA</text>
  <line x1="140" y1="110" x2="140" y2="140" stroke="#F7F3EA" stroke-width="2"/>

  <!-- nó / Vc -->
  <circle cx="140" cy="140" r="3.5" fill="#D6A84F"/>
  <line x1="140" y1="140" x2="245" y2="140" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="245" cy="140" r="4" fill="#D6A84F"/>
  <text x="253" y="144" font-family="JetBrains Mono, monospace" font-size="11" fill="#CBD5E1">VC</text>

  <!-- capacitor -->
  <line x1="140" y1="140" x2="140" y2="164" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="124" y1="164" x2="156" y2="164" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="124" y1="172" x2="156" y2="172" stroke="#F7F3EA" stroke-width="2.5"/>
  <text x="160" y="172" font-family="JetBrains Mono, monospace" font-size="11" fill="#CBD5E1">C = 1 µF</text>
  <line x1="140" y1="172" x2="140" y2="206" stroke="#F7F3EA" stroke-width="2"/>

  <!-- terra -->
  <line x1="128" y1="206" x2="152" y2="206" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="132" y1="211" x2="148" y2="211" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="136" y1="216" x2="144" y2="216" stroke="#CBD5E1" stroke-width="2"/>

  <text x="20" y="242" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">dV/dt = I/C = 0,5 mA / 1 µF = 0,5 V/ms (rampa linear)</text>
</svg>
