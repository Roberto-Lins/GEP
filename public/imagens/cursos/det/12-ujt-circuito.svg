<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Oscilador de relaxação com UJT: R carrega o capacitor, e o UJT dispara em VP descarregando-o">
  <rect x="0.75" y="0.75" width="478.5" height="298.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="14" fill="#CBD5E1">Oscilador de relaxação com UJT</text>

  <!-- trilhos -->
  <line x1="60" y1="46" x2="400" y2="46" stroke="#F7F3EA" stroke-width="2"/>
  <text x="404" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">+VCC</text>
  <line x1="60" y1="278" x2="400" y2="278" stroke="#F7F3EA" stroke-width="2"/>
  <text x="404" y="282" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">GND</text>

  <!-- R de carga: VCC -> emissor -->
  <line x1="110" y1="46" x2="110" y2="66" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M110 66 l-7 6 l14 6 l-14 6 l14 6 l-14 6 l7 6" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="84" y="92" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">R</text>
  <line x1="110" y1="102" x2="110" y2="160" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="110" cy="160" r="3.5" fill="#D6A84F"/>
  <text x="86" y="156" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">E</text>

  <!-- C: emissor -> GND -->
  <line x1="110" y1="160" x2="110" y2="216" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="96" y1="216" x2="124" y2="216" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="96" y1="224" x2="124" y2="224" stroke="#F7F3EA" stroke-width="2.5"/>
  <text x="128" y="224" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">C</text>
  <line x1="110" y1="224" x2="110" y2="278" stroke="#F7F3EA" stroke-width="2"/>

  <!-- UJT -->
  <circle cx="250" cy="160" r="30" fill="none" stroke="#F7F3EA" stroke-width="1.5"/>
  <line x1="252" y1="132" x2="252" y2="188" stroke="#F7F3EA" stroke-width="3"/>     <!-- barra interbase -->
  <line x1="110" y1="160" x2="248" y2="168" stroke="#F7F3EA" stroke-width="2"/>     <!-- emissor -->
  <polygon points="248,168 238,162 240,172" fill="#F7F3EA"/>                        <!-- seta do emissor -->
  <text x="160" y="155" font-family="Inter, sans-serif" font-size="9" fill="#64748B">emissor</text>

  <!-- B2 (topo) -> RB2 -> VCC -->
  <line x1="252" y1="132" x2="252" y2="112" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M252 112 l-7 -6 l14 -6 l-14 -6 l14 -6 l-14 -6 l7 -6" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="262" y="86" font-family="JetBrains Mono, monospace" font-size="10" fill="#CBD5E1">RB2</text>
  <line x1="252" y1="64" x2="252" y2="46" stroke="#F7F3EA" stroke-width="2"/>
  <text x="258" y="130" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">B2</text>

  <!-- B1 (base) -> RB1 -> GND, saída -->
  <line x1="252" y1="188" x2="252" y2="208" stroke="#F7F3EA" stroke-width="2"/>
  <circle cx="252" cy="208" r="3.5" fill="#D6A84F"/>
  <path d="M252 208 l-7 6 l14 6 l-14 6 l14 6 l-14 6 l7 6" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="262" y="234" font-family="JetBrains Mono, monospace" font-size="10" fill="#CBD5E1">RB1</text>
  <line x1="252" y1="244" x2="252" y2="278" stroke="#F7F3EA" stroke-width="2"/>
  <text x="258" y="200" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">B1</text>
  <line x1="252" y1="208" x2="340" y2="208" stroke="#D6A84F" stroke-width="2"/>
  <circle cx="340" cy="208" r="4" fill="#D6A84F"/>
  <text x="348" y="204" font-family="JetBrains Mono, monospace" font-size="11" fill="#CBD5E1">Vo</text>

  <text x="150" y="296" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">VP = VK + 0,7 V    (VK = η·VCC)</text>
</svg>
