<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" width="660" height="240" role="img" aria-label="Cadeia da fonte: CA, retificador, filtro, regulador e carga, com a forma de onda em cada estágio">
  <rect x="0.75" y="0.75" width="658.5" height="238.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" fill="#CBD5E1">Da rede à carga: a cadeia da fonte</text>

  <!-- blocos -->
  <g font-family="Inter, sans-serif" font-size="12">
    <rect x="20" y="56" width="96" height="46" rx="8" fill="#13243B" stroke="#F7F3EA" stroke-width="1.5"/>
    <text x="44" y="84" fill="#F7F3EA">Rede CA</text>
    <rect x="150" y="56" width="96" height="46" rx="8" fill="#13243B" stroke="#F7F3EA" stroke-width="1.5"/>
    <text x="162" y="78" fill="#F7F3EA">Retifica-</text>
    <text x="162" y="93" fill="#F7F3EA">dor</text>
    <rect x="280" y="56" width="96" height="46" rx="8" fill="#13243B" stroke="#F7F3EA" stroke-width="1.5"/>
    <text x="305" y="84" fill="#F7F3EA">Filtro</text>
    <rect x="410" y="56" width="110" height="46" rx="8" fill="#13243B" stroke="#D6A84F" stroke-width="2"/>
    <text x="430" y="84" fill="#D6A84F" font-weight="bold">Regulador</text>
    <rect x="554" y="56" width="86" height="46" rx="8" fill="#13243B" stroke="#F7F3EA" stroke-width="1.5"/>
    <text x="578" y="84" fill="#F7F3EA">Carga</text>
  </g>

  <!-- setas -->
  <g stroke="#64748B" stroke-width="2" fill="#64748B">
    <line x1="116" y1="79" x2="148" y2="79"/><polygon points="148,75 154,79 148,83"/>
    <line x1="246" y1="79" x2="278" y2="79"/><polygon points="278,75 284,79 278,83"/>
    <line x1="376" y1="79" x2="408" y2="79"/><polygon points="408,75 414,79 408,83"/>
    <line x1="520" y1="79" x2="552" y2="79"/><polygon points="552,75 558,79 552,83"/>
  </g>

  <!-- mini formas de onda em cada estágio -->
  <g fill="none" stroke-width="2">
    <!-- CA: senoide -->
    <path d="M28 175 q12 -28 24 0 t24 0 t24 0" stroke="#CBD5E1"/>
    <text x="34" y="205" font-family="Inter, sans-serif" font-size="10" fill="#64748B">CA</text>
    <!-- pulsante (retificada) -->
    <path d="M154 175 q12 -28 24 0 q12 -28 24 0 q12 -28 24 0" stroke="#CBD5E1"/>
    <text x="160" y="205" font-family="Inter, sans-serif" font-size="10" fill="#64748B">pulsante</text>
    <!-- ripple (filtrada) -->
    <path d="M284 165 q12 8 24 0 t24 0 t24 0" stroke="#CBD5E1"/>
    <text x="300" y="205" font-family="Inter, sans-serif" font-size="10" fill="#64748B">ripple</text>
    <!-- DC estável (regulada) -->
    <path d="M420 162 H516" stroke="#D6A84F"/>
    <text x="438" y="205" font-family="Inter, sans-serif" font-size="10" fill="#D6A84F">CC estável</text>
    <!-- carga -->
    <path d="M566 162 h12 l5 -8 l8 16 l8 -16 l8 16 l5 -8 h12" stroke="#CBD5E1"/>
    <text x="582" y="205" font-family="Inter, sans-serif" font-size="10" fill="#64748B">RL</text>
  </g>

  <text x="20" y="228" font-family="Inter, sans-serif" font-size="11" fill="#64748B">O filtro só suaviza (ripple); quem deixa a saída realmente plana é o regulador.</text>
</svg>
