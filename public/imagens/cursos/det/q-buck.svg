<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" role="img" aria-label="Conversor buck: transistor chaveado, diodo de roda livre, indutor, capacitor e carga RL">
  <rect x="0.75" y="0.75" width="498.5" height="258.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="26" font-family="Inter, sans-serif" font-size="13" fill="#CBD5E1">Regulador chaveado (buck)</text>

  <!-- entrada -->
  <circle cx="46" cy="60" r="4" fill="#D6A84F"/>
  <text x="20" y="54" font-family="JetBrains Mono, monospace" font-size="11" fill="#CBD5E1">VIN=20</text>
  <line x1="46" y1="60" x2="120" y2="60" stroke="#F7F3EA" stroke-width="2"/>

  <!-- transistor chave (NPN) -->
  <circle cx="125" cy="86" r="22" fill="none" stroke="#F7F3EA" stroke-width="1.5"/>
  <line x1="113" y1="72" x2="113" y2="100" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="125" y1="60" x2="125" y2="66" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="113" y1="78" x2="125" y2="66" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="113" y1="94" x2="125" y2="106" stroke="#F7F3EA" stroke-width="2"/>
  <polygon points="125,106 117,101 120,110" fill="#F7F3EA"/>
  <line x1="125" y1="106" x2="125" y2="130" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="80" y1="86" x2="113" y2="86" stroke="#D6A84F" stroke-width="2"/>
  <text x="46" y="90" font-family="Inter, sans-serif" font-size="10" fill="#D6A84F">PWM</text>

  <!-- nó A -->
  <circle cx="125" cy="130" r="3.5" fill="#D6A84F"/>
  <text x="100" y="126" font-family="JetBrains Mono, monospace" font-size="9" fill="#94A3B8">A</text>

  <!-- diodo de roda livre (A -> terra) -->
  <line x1="125" y1="130" x2="125" y2="150" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="111" y1="150" x2="139" y2="150" stroke="#F7F3EA" stroke-width="2.5"/>
  <polygon points="111,172 139,172 125,150" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="143" y="166" font-family="Inter, sans-serif" font-size="10" fill="#CBD5E1">D</text>
  <line x1="125" y1="172" x2="125" y2="210" stroke="#F7F3EA" stroke-width="2"/>

  <!-- indutor A -> VOUT -->
  <line x1="125" y1="130" x2="170" y2="130" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M170 130 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0 a10 10 0 0 1 20 0" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="208" y="112" font-family="Inter, sans-serif" font-size="11" fill="#CBD5E1">L</text>
  <line x1="250" y1="130" x2="330" y2="130" stroke="#F7F3EA" stroke-width="2"/>

  <!-- VOUT -->
  <circle cx="300" cy="130" r="3.5" fill="#D6A84F"/>
  <circle cx="430" cy="130" r="4" fill="#D6A84F"/>
  <text x="408" y="122" font-family="JetBrains Mono, monospace" font-size="11" fill="#CBD5E1">VOUT</text>
  <line x1="330" y1="130" x2="430" y2="130" stroke="#F7F3EA" stroke-width="2"/>

  <!-- capacitor -->
  <line x1="300" y1="130" x2="300" y2="156" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="286" y1="156" x2="314" y2="156" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="286" y1="164" x2="314" y2="164" stroke="#F7F3EA" stroke-width="2.5"/>
  <text x="318" y="164" font-family="Inter, sans-serif" font-size="10" fill="#CBD5E1">C</text>
  <line x1="300" y1="164" x2="300" y2="210" stroke="#F7F3EA" stroke-width="2"/>

  <!-- carga -->
  <line x1="430" y1="130" x2="430" y2="150" stroke="#F7F3EA" stroke-width="2"/>
  <path d="M430 150 l-7 6 l14 6 l-14 6 l14 6 l-14 6 l7 6" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <text x="442" y="176" font-family="Inter, sans-serif" font-size="10" fill="#CBD5E1">RL</text>
  <line x1="430" y1="186" x2="430" y2="210" stroke="#F7F3EA" stroke-width="2"/>

  <!-- terra -->
  <line x1="125" y1="210" x2="430" y2="210" stroke="#F7F3EA" stroke-width="2"/>

  <text x="20" y="240" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">VOUT = D·VIN ; o transistor opera como chave (PWM)</text>
</svg>
