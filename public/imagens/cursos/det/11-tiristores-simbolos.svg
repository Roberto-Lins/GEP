<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="540" height="230" role="img" aria-label="Símbolos do SCR (com porta, unidirecional), DIAC (sem porta, bidirecional) e TRIAC (com porta, bidirecional)">
  <rect x="0.75" y="0.75" width="538.5" height="228.5" rx="14" fill="#0B1220" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" fill="#CBD5E1">Tiristores: SCR · DIAC · TRIAC</text>

  <!-- ===== SCR ===== -->
  <text x="100" y="56" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">A</text>
  <line x1="110" y1="62" x2="110" y2="84" stroke="#F7F3EA" stroke-width="2"/>
  <polygon points="94,84 126,84 110,104" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="94" y1="104" x2="126" y2="104" stroke="#F7F3EA" stroke-width="2.5"/>
  <line x1="110" y1="104" x2="110" y2="140" stroke="#F7F3EA" stroke-width="2"/>
  <text x="100" y="160" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">K</text>
  <!-- gate -->
  <line x1="122" y1="104" x2="148" y2="118" stroke="#D6A84F" stroke-width="2"/>
  <text x="152" y="122" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">G</text>
  <text x="92" y="190" font-family="Inter, sans-serif" font-size="13" fill="#F7F3EA" font-weight="bold">SCR</text>
  <text x="60" y="208" font-family="Inter, sans-serif" font-size="10" fill="#64748B">unidirecional, com porta</text>

  <!-- ===== DIAC ===== -->
  <text x="270" y="56" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">A1</text>
  <line x1="280" y1="62" x2="280" y2="80" stroke="#F7F3EA" stroke-width="2"/>
  <polygon points="264,80 296,80 280,102" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <polygon points="264,120 296,120 280,98" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="280" y1="120" x2="280" y2="140" stroke="#F7F3EA" stroke-width="2"/>
  <text x="270" y="158" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">A2</text>
  <text x="262" y="190" font-family="Inter, sans-serif" font-size="13" fill="#F7F3EA" font-weight="bold">DIAC</text>
  <text x="232" y="208" font-family="Inter, sans-serif" font-size="10" fill="#64748B">bidirecional, sem porta</text>

  <!-- ===== TRIAC ===== -->
  <text x="438" y="56" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">MT2</text>
  <line x1="450" y1="62" x2="450" y2="80" stroke="#F7F3EA" stroke-width="2"/>
  <polygon points="434,80 466,80 450,102" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <polygon points="434,120 466,120 450,98" fill="none" stroke="#F7F3EA" stroke-width="2"/>
  <line x1="450" y1="120" x2="450" y2="140" stroke="#F7F3EA" stroke-width="2"/>
  <text x="438" y="158" font-family="JetBrains Mono, monospace" font-size="11" fill="#94A3B8">MT1</text>
  <!-- gate -->
  <line x1="466" y1="118" x2="492" y2="130" stroke="#D6A84F" stroke-width="2"/>
  <text x="496" y="134" font-family="JetBrains Mono, monospace" font-size="11" fill="#D6A84F">G</text>
  <text x="430" y="190" font-family="Inter, sans-serif" font-size="13" fill="#F7F3EA" font-weight="bold">TRIAC</text>
  <text x="402" y="208" font-family="Inter, sans-serif" font-size="10" fill="#64748B">bidirecional, com porta</text>
</svg>
