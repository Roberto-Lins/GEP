<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img"
     aria-label="Diagrama do efeito Sagnac: um feixe de laser é dividido num separador de feixe e percorre o mesmo anel óptico em sentidos opostos. Quando o anel gira com velocidade angular ômega, o feixe co-rotante percorre um caminho maior e o contra-rotante um caminho menor, gerando uma diferença de fase proporcional a ômega, lida no detector.">
  <defs>
    <marker id="seta-dourado" markerWidth="11" markerHeight="11" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#D6A84F"/>
    </marker>
    <marker id="seta-azul" markerWidth="11" markerHeight="11" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#7CC0FF"/>
    </marker>
    <marker id="seta-marfim" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#F7F3EA"/>
    </marker>
  </defs>

  <!-- fundo -->
  <rect x="0" y="0" width="820" height="560" rx="16" fill="#0B1220"/>
  <rect x="1" y="1" width="818" height="558" rx="15" fill="none" stroke="#D6A84F" stroke-opacity="0.35" stroke-width="2"/>

  <!-- título -->
  <text x="410" y="40" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="25" fill="#F7F3EA" font-weight="600">Efeito Sagnac — interferômetro óptico em rotação</text>
  <text x="410" y="66" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#9FB3C8">Base do RLG (laser em anel) e do FOG (fibra óptica) — giroscópios sem peças girantes</text>

  <!-- plataforma que gira: anel óptico -->
  <circle cx="410" cy="285" r="150" fill="none" stroke="#1E3A5F" stroke-width="26"/>
  <circle cx="410" cy="285" r="150" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

  <!-- feixe contra-rotante (caminho menor) - azul, sobe pela esquerda (anti-horário) -->
  <path d="M 384 433 A 150 150 0 0 1 260 285" fill="none" stroke="#7CC0FF" stroke-width="5" marker-end="url(#seta-azul)"/>
  <path d="M 260 285 A 150 150 0 0 1 384 137" fill="none" stroke="#7CC0FF" stroke-width="5" marker-end="url(#seta-azul)"/>

  <!-- feixe co-rotante (caminho maior) - dourado, sobe pela direita (horário) -->
  <path d="M 436 433 A 150 150 0 0 0 560 285" fill="none" stroke="#D6A84F" stroke-width="5" marker-end="url(#seta-dourado)"/>
  <path d="M 560 285 A 150 150 0 0 0 436 137" fill="none" stroke="#D6A84F" stroke-width="5" marker-end="url(#seta-dourado)"/>

  <!-- seta de rotação Ω no centro -->
  <path d="M 357 285 A 53 53 0 1 1 380 329" fill="none" stroke="#22C55E" stroke-width="5" marker-end="url(#seta-marfim)" stroke-opacity="0.9"/>
  <text x="410" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="34" fill="#22C55E" font-weight="700">&#937;</text>
  <text x="410" y="304" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#A7F3D0">rotação do anel</text>

  <!-- separador de feixe (beam splitter) na base do anel -->
  <g transform="translate(410 435) rotate(45)">
    <rect x="-13" y="-13" width="26" height="26" fill="#0B1220" stroke="#F7F3EA" stroke-width="2"/>
  </g>
  <text x="410" y="478" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#CBD5E1">separador de feixe</text>

  <!-- fonte laser (esquerda) -->
  <rect x="86" y="416" width="96" height="38" rx="6" fill="#1E3A5F" stroke="#D6A84F" stroke-width="1.5"/>
  <text x="134" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F7F3EA">LASER</text>
  <line x1="182" y1="435" x2="392" y2="435" stroke="#F7F3EA" stroke-width="3" marker-end="url(#seta-marfim)"/>

  <!-- detector (direita) -->
  <rect x="640" y="416" width="104" height="38" rx="6" fill="#1E3A5F" stroke="#7CC0FF" stroke-width="1.5"/>
  <text x="692" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F7F3EA">DETECTOR</text>
  <line x1="428" y1="435" x2="636" y2="435" stroke="#7CC0FF" stroke-width="3" marker-end="url(#seta-azul)"/>
  <text x="535" y="425" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#7CC0FF" font-weight="600">&#916;&#966; &#8733; &#937;</text>

  <!-- legendas laterais -->
  <text x="150" y="150" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#7CC0FF" font-weight="600">Feixe contra-rotante</text>
  <text x="150" y="170" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9FB3C8">caminho MENOR &#8594; chega antes</text>

  <text x="670" y="150" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#D6A84F" font-weight="600">Feixe co-rotante</text>
  <text x="670" y="170" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#9FB3C8">caminho MAIOR &#8594; chega depois</text>

  <!-- fórmulas -->
  <text x="410" y="520" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14.5" fill="#F7F3EA">&#916;t = 4A&#937;/c&#178;   &#8226;   FOG:  &#916;&#966; = 8&#960;NA&#937; / (&#955;c)   &#8226;   RLG:  &#916;f = 4A&#937; / (&#955;L)</text>
  <text x="410" y="543" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#8095A8">A = área do anel &#183; N = nº de espiras &#183; &#955; = comprimento de onda &#183; L = perímetro &#183; c = vel. da luz</text>
</svg>
