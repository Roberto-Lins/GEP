<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Fundamentos de Automação de Sistemas — capa">
  <defs>
    <linearGradient id="fasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#13243B"/>
      <stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
    <pattern id="fasGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D6A84F" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="800" height="360" fill="url(#fasBg)"/>
  <rect width="800" height="360" fill="url(#fasGrid)"/>

  <!-- malha de controle estilizada (decorativa): sensor → transmissor → controlador → atuador -->
  <g opacity="0.9" stroke-linejoin="round" stroke-linecap="round">
    <!-- linha de processo -->
    <path d="M60 250 H740" stroke="#334155" stroke-width="4"/>
    <!-- nós da malha -->
    <circle cx="150" cy="250" r="26" fill="none" stroke="#CBD5E1" stroke-width="3"/>
    <text x="150" y="256" font-family="monospace" font-size="20" fill="#CBD5E1" text-anchor="middle">TT</text>
    <circle cx="400" cy="150" r="30" fill="none" stroke="#D6A84F" stroke-width="3"/>
    <text x="400" y="157" font-family="monospace" font-size="22" fill="#D6A84F" text-anchor="middle">TIC</text>
    <circle cx="650" cy="250" r="26" fill="none" stroke="#CBD5E1" stroke-width="3"/>
    <text x="650" y="256" font-family="monospace" font-size="20" fill="#CBD5E1" text-anchor="middle">TCV</text>
    <!-- linhas de sinal (tracejadas = elétrico) -->
    <path d="M150 224 V150 H370" stroke="#D6A84F" stroke-width="2.5" stroke-dasharray="7 6"/>
    <path d="M430 150 H650 V224" stroke="#D6A84F" stroke-width="2.5" stroke-dasharray="7 6"/>
  </g>

  <!-- mostrador de instrumento -->
  <g transform="translate(700,300)" opacity="0.95">
    <path d="M-34 6 A34 34 0 0 1 34 6" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M-34 6 A34 34 0 0 1 14 -25" fill="none" stroke="#D6A84F" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 6 L20 -14" stroke="#F7F3EA" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="4.5" fill="#D6A84F"/>
  </g>

  <!-- senóide (sinal do sensor) -->
  <path d="M60 320 q24 -34 48 0 t48 0 t48 0 t48 0" fill="none" stroke="#CBD5E1" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
</svg>
